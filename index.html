<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f4;--card:#fff;--tx:#1b2a22;--mu:#66756c;--pr:#0f6b4a;--pt:#fff;--bd:#dfe4de;--bad:#b3261e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--tx:#e8eee9;--mu:#92a39a;--pr:#3fbf8c;--pt:#06231a;--bd:#2a3730;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 0}h1{margin:0;font-size:19px}small,.mu{color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:14px}
nav button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
main{padding:0 16px 40px;max-width:900px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1 1 140px}
.b{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600}
.g{background:transparent;color:var(--pr);border:1px solid var(--bd)}.d{color:var(--bad)}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
td input{padding:6px;min-width:56px}label{font-size:13px;color:var(--mu);display:block;margin:6px 0 3px}
.ov{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:9}.ov.show{display:block}
.rp{background:#fff;color:#000;max-width:720px;margin:12px auto;padding:20px;border:2px solid #000}
.rp table{color:#000}.rp th,.rp td{border:1px solid #444;padding:5px}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;padding:0}.np{display:none!important}.rp{border:2px solid #000;margin:0 auto}}
.lg{position:relative;overflow:hidden;border-radius:16px;padding:22px 14px 18px;background:linear-gradient(160deg,#0f6b4a,#0b3d2c 60%,#10243a);color:#fff;min-height:78vh}
.lg .fl{position:absolute;bottom:-40px;font-size:28px;opacity:.55;animation:up 9s linear infinite}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg)}}
.lg .c{position:relative;z-index:1}
.bk{display:block;margin:0 auto 4px;width:130px;height:86px;position:relative;z-index:1}
.pg{transform-box:fill-box;transform-origin:0 50%;animation:flip 3s ease-in-out infinite}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.pw{position:relative;z-index:1;text-align:center;margin-top:18px;font-size:13px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 4px #7dffc4;opacity:.8}50%{text-shadow:0 0 14px #7dffc4,0 0 28px #3fbf8c;opacity:1}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7dffc4;margin-right:8px;animation:rad 2s infinite}
@keyframes rad{0%{box-shadow:0 0 0 0 rgba(125,255,196,.7)}100%{box-shadow:0 0 0 14px rgba(125,255,196,0)}}
@media(prefers-reduced-motion:reduce){.lg *{animation:none!important}}
.rp{position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}.rp>*:not(.wm){position:relative;z-index:1}
.rp table{width:100%;border-collapse:collapse;font-size:11.5px}.cg th,.cg td,.dm th,.dm td,.in td{border:1px solid #444;padding:3px 4px;text-align:center}.cg td:first-child,.in td,.dm td:first-child{text-align:left}.cg th,.dm th{background:#e8f4ee}
</style></head><body>
<header><h1 id="ttl"></h1><small id="sub"></small> · <small id="ind"></small></header>
<nav id="nav"></nav><main id="m"></main>
<div class="ov" id="ov"><div class="np r" style="margin:0 auto;max-width:720px"><button class="b" id="pb" onclick="sharePdf()">Share as PDF</button><button class="b g" onclick="window.print()">Print</button><button class="b g" onclick="$('#ov').classList.remove('show')">Close</button><small class="mu" style="flex-basis:100%">If Print does nothing: open this page in Chrome, tap the ⋮ menu, then Share → Print or Save as PDF.</small></div><div class="np" id="bar" style="max-width:720px;margin:10px auto"></div><div id="rp"></div></div>
<script>
const $=s=>document.querySelector(s);
let db;try{db=JSON.parse(localStorage.getItem('sms'))}catch(e){}
const DS={name:'My School',addr:'',phone:'',aff:'Punctuality,Reliability,Neatness,Honesty,Self-control,Attentiveness,Relationship with students,Relationship with staff,Politeness,Loyalty',psy:'Handwriting,Verbal fluency,Sports,Drawing and painting,Musical skills',motto:'',hm:'',logo:'',sig:'',seal:'',bank:'',acn:'',acc:'',session:'2026/2027',term:'First Term',fee:50000,next:'',ca:40,ca2:0,ex:60,rt:'Final Report',level:'',gb:'A:70,B:60,C:50,D:45,E:40,F:0',rem:'Excellent result. Keep it up.\nVery good performance.\nGood, but can do better.\nFair. More effort is needed.\nPoor. Needs serious improvement.',subjects:['English','Mathematics','Basic Science','Civic Education','Computer Studies']};
db=db||{school:{},students:[],scores:{},pays:[],att:{}};db.school={...DS,...db.school};db.cm=db.cm||{};
const save=()=>{clearTimeout(window._st);window._st=setTimeout(()=>push(),700)};
const say=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pr);color:var(--pt);padding:12px;border-radius:10px;z-index:99;text-align:center';document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>'₦'+Number(n||0).toLocaleString();
const today=()=>new Date().toISOString().slice(0,10);
let tab='Students',cls='',subj='';
const tabs=['Students','Results','Fees','Attendance','Settings'];
const classes=()=>{let c=[...new Set(db.students.map(s=>s.cls))].sort();if(prof&&prof.role==='teacher'){const m=(prof.classes||'').split(',').map(x=>x.trim());c=c.filter(x=>m.includes(x))}return c};
const inCls=c=>db.students.filter(s=>s.cls===c);
const grade=t=>{const b=db.school.gb.split(',').map(x=>x.split(':')).map(([g,m])=>[g.trim(),+m]).sort((a,b)=>b[1]-a[1]);return(b.find(x=>t>=x[1])||b[b.length-1])[0]};
const remark=a=>{const r=db.school.rem.split('\n');return r[a>=70?0:a>=60?1:a>=50?2:a>=40?3:4]||''};
const avg=id=>sum(id)/db.school.subjects.length;
const tcm=id=>(db.scores[id]||{})._t||(db.cm[id]||{}).t||remark(avg(id));
const bk=()=>db.school.acc?`Pay to: ${db.school.bank}, Account name: ${db.school.acn}, Account number: ${db.school.acc}.`:'';
const acb=()=>db.school.acc?`<p><b>School account details</b><br>Bank: ${esc(db.school.bank)}<br>Account name: ${esc(db.school.acn)}<br>Account number: <b>${esc(db.school.acc)}</b></p>`:'';
const foot=()=>`<hr><div style="text-align:center;font-size:12px;color:#444">Powered by <b>Softsub Digital</b> · 09126459668</div>`;
const sign=()=>db.school.sig?`<img src="${db.school.sig}" style="height:54px">`:'<div style="height:54px"></div>';
const hmBlock=t=>`<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;gap:8px"><div>${t?'Teacher: ________':''}</div>${db.school.seal?`<img src="${db.school.seal}" style="height:80px;opacity:.9">`:'<div></div>'}<div style="text-align:center">${sign()}<div style="border-top:1px solid #000;padding-top:2px;font-size:13px">Head Teacher${db.school.hm?': '+esc(db.school.hm):''}</div></div></div>`;
const ph=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'234'+p.slice(1):p};
const wa=(s,m)=>`${s.phone?`<a class="b" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block" href="https://wa.me/${ph(s.phone)}?text=${encodeURIComponent(m)}">Send on WhatsApp</a> `:'<small>Add parent phone to send on WhatsApp. </small>'}${s.email?`<a class="b g" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block" href="mailto:${esc(s.email)}?subject=${encodeURIComponent(db.school.name+': '+db.school.term+' '+db.school.session)}&body=${encodeURIComponent(`Dear Parent/Guardian of ${s.name},\n\n${m}\n\nYours faithfully,\n${db.school.hm||'The Management'}\n${db.school.name}${db.school.phone?'\n'+db.school.phone:''}\n\nPowered by Softsub Digital`)}">Send by email</a>`:''}`;
const sc=(id,s)=>(db.scores[id]||{})[s]||[];
const tot=(id,s)=>{const x=sc(id,s);return x.length?(+x[0]||0)+(+x[1]||0)+(+x[2]||0):null};
const sum=id=>db.school.subjects.reduce((a,s)=>a+(tot(id,s)||0),0);
const pos=id=>{const st=db.students.find(x=>x.id===id);const l=inCls(st.cls).map(x=>sum(x.id)).sort((a,b)=>b-a);return l.indexOf(sum(id))+1+' of '+l.length};
const paid=id=>db.pays.filter(p=>p.sid===id).reduce((a,p)=>a+p.amt,0);
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function clsPick(){const c=classes();if(!c.includes(cls))cls=c[0]||'';return c.length?`<select onchange="cls=this.value;go()">${opts(c,cls)}</select>`:'<p class="mu">Add students first.</p>'}
function go(t){if(t)tab=t;$('#ttl').textContent=db.school.name;$('#sub').textContent=db.school.session+' · '+db.school.term;
$('#nav').innerHTML=tabs.map(x=>`<button class="${x===tab?'on':''}" onclick="go('${x}')">${x}</button>`).join('')+'<button onclick="loadAll().then(()=>go())">Refresh</button><button onclick="out()">Log out</button>';
$('#m').innerHTML=V[tab]();save()}
const V={
Students(){const own=db.students.reduce((a,s)=>a+Math.max(s.fee-paid(s.id),0),0);return `<div class="r"><div class="c"><small>Students</small><h2 style="margin:0">${db.students.length}</h2></div><div class="c"><small>Fees collected</small><h2 style="margin:0">${N(db.pays.reduce((a,p)=>a+p.amt,0))}</h2></div><div class="c"><small>Outstanding</small><h2 style="margin:0;color:var(--bad)">${N(own)}</h2></div></div><div class="c"><b>Add student</b><div class="r"><div><label>Full name</label><input id="n"></div><div><label>Class (e.g. JSS 1)</label><input id="c" value="${esc(cls)}"></div><div><label>Parent phone</label><input id="p" type="tel"></div><div><label>Parent email (optional)</label><input id="e" type="email"></div><div><label>Sex</label><select id="sx2"><option>Male</option><option>Female</option></select></div><div><label>Term fee (₦)</label><input id="f" type="number" value="${db.school.fee}"></div></div><p><button class="b" onclick="addS()">Add student</button></p></div>
<div class="c"><b>Bulk add (saves time)</b><label>Class</label><input id="bc" value="${esc(cls)}"><label>One student per line: Name, phone, email</label><textarea id="bl" rows="4"></textarea><p><button class="b" onclick="bulk()">Import list</button></p></div><div class="c t"><b>${db.students.length} students</b><table><tr><th>Name</th><th>Class</th><th>Phone</th><th></th></tr>${db.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.cls)}</td><td>${esc(s.phone)}</td><td><button class="b g d" onclick="delS('${s.id}')">Remove</button></td></tr>`).join('')}</table></div>`},
Results(){if(!subj||!db.school.subjects.includes(subj))subj=db.school.subjects[0];
return `<div class="c"><div class="r">${clsPick()}<select onchange="subj=this.value;go()">${opts(db.school.subjects,subj)}</select></div><p><button class="b" onclick="allRep()">Print all report cards for this class</button></p></div>
<div class="c t"><b>${esc(subj)}</b> <small>CA max ${db.school.ca}${db.school.ca2?' · CA 2 max '+db.school.ca2:''} · Exam max ${db.school.ex}</small><table><tr><th>Student</th><th>CA</th>${db.school.ca2?'<th>CA 2</th>':''}<th>Exam</th><th>Total</th><th>Grade</th><th></th></tr>${inCls(cls).map(s=>{const x=sc(s.id,subj),t=tot(s.id,subj);return `<tr><td>${esc(s.name)}</td><td><input type="number" min="0" max="${db.school.ca}" value="${x[0]??''}" onchange="setSc('${s.id}',0,this.value)"></td>${db.school.ca2?`<td><input type="number" min="0" max="${db.school.ca2}" value="${x[2]??''}" onchange="setSc('${s.id}',2,this.value)"></td>`:''}<td><input type="number" min="0" max="${db.school.ex}" value="${x[1]??''}" onchange="setSc('${s.id}',1,this.value)"></td><td id="t${s.id}">${t??''}</td><td id="g${s.id}">${t==null?'':grade(t)}</td><td><button class="b g" onclick="report('${s.id}')">Report</button></td></tr>`}).join('')}</table></div>${rank()}`},
Fees(){return `<div class="c">${clsPick()}</div><div class="c t"><table><tr><th>Student</th><th>Fee</th><th>Paid</th><th>Owes</th><th></th></tr>${inCls(cls).map(s=>{const p=paid(s.id),o=s.fee-p;return `<tr><td>${esc(s.name)}</td><td>${N(s.fee)}</td><td>${N(p)}</td><td style="color:${o>0?'var(--bad)':'inherit'}">${N(Math.max(o,0))}</td><td><button class="b g" onclick="pay('${s.id}')">Pay</button> <button class="b g" onclick="rcpt('${s.id}')">Receipt</button>${o>0?` <button class="b g" onclick="remind('${s.id}')">Remind</button>`:''}</td></tr>`}).join('')}</table></div>
<div class="c"><b>Total collected:</b> ${N(db.pays.reduce((a,p)=>a+p.amt,0))}</div>`},
Attendance(){const d=window.ad||today();window.ad=d;const a=((db.att[d]||{})[cls])||{};
return `<div class="c"><div class="r">${clsPick()}<input type="date" value="${d}" onchange="ad=this.value;go()"></div></div><div class="c t"><table>${inCls(cls).map(s=>`<tr><td>${esc(s.name)}</td><td><button class="b ${a[s.id]==='P'?'':'g'}" onclick="mark('${s.id}','P')">Present</button> <button class="b ${a[s.id]==='A'?'':'g'} d" onclick="mark('${s.id}','A')">Absent</button></td></tr>`).join('')}</table><p class="mu">Present: ${Object.values(a).filter(v=>v==='P').length} · Absent: ${Object.values(a).filter(v=>v==='A').length}</p></div>`},
Users(){setTimeout(loadUsers,0);return '<div class="c t" id="us">Loading…</div>'},
Settings(){const s=db.school;return `<div class="c"><div class="r"><div><label>School name</label><input id="sn" value="${esc(s.name)}"></div><div><label>Address / motto</label><input id="sa" value="${esc(s.addr)}"></div><div><label>Session</label><input id="ss" value="${esc(s.session)}"></div><div><label>Term</label><select id="st">${opts(['First Term','Second Term','Third Term'],s.term)}</select></div><div><label>Default term fee (₦)</label><input id="sf" type="number" value="${s.fee}"></div><div><label>School phone</label><input id="sp" value="${esc(s.phone)}"></div><div><label>Bank name</label><input id="sbk" value="${esc(s.bank)}"></div><div><label>Account name</label><input id="san" value="${esc(s.acn)}"></div><div><label>Account number</label><input id="sac" value="${esc(s.acc)}" inputmode="numeric"></div><div><label>School motto</label><input id="smo" value="${esc(s.motto)}"></div><div><label>Head teacher's name</label><input id="shm" value="${esc(s.hm)}"></div><div><label>Next term begins</label><input id="sx" value="${esc(s.next)}" placeholder="e.g. 12 Jan 2027"></div><div><label>1st CA max</label><input id="sca" type="number" value="${s.ca}"></div><div><label>Exam max</label><input id="sex" type="number" value="${s.ex}"></div><div><label>2nd CA max (0 = not used)</label><input id="sca2" type="number" value="${s.ca2}"></div></div><label>Report title ending (e.g. Final Report)</label><input id="srt" value="${esc(s.rt)}"><label>Level name if the class name is not recognised (e.g. Junior Secondary School)</label><input id="slv" value="${esc(s.level)}"><label>Grading (grade:minimum score)</label><input id="sg" value="${esc(s.gb)}"><label>Affective domain items (comma separated)</label><input id="saf" value="${esc(s.aff)}"><label>Psychomotor items (comma separated)</label><input id="sps" value="${esc(s.psy)}"><label>Subjects (comma separated)</label><input id="sj" value="${esc(s.subjects.join(', '))}"><label>Auto teacher comments by average (5 lines: 70+, 60+, 50+, 40+, below 40)</label><textarea id="sr" rows="5">${esc(s.rem)}</textarea><p><button class="b" onclick="saveSet()">Save settings</button></p></div>
<div class="c"><b>Logo, signature and seal</b><p class="mu">Upload clear pictures (a signature on white paper works best). The logo shows faded behind every result and receipt. The signature and seal appear at the bottom of every result and receipt.</p>${[['logo','School logo'],['sig','Head teacher signature'],['seal','School seal / stamp']].map(([k,l])=>`<label>${l}</label>${s[k]?`<img src="${s[k]}" style="height:50px;background:#fff;border:1px solid var(--bd)"> <button class="b g d" onclick="db.school.${k}='';go()">Remove</button>`:''}<input type="file" accept="image/*" onchange="img(this,'${k}')">`).join('')}</div>
<div class="c"><b>Backup &amp; restore</b><p class="mu">Your data is stored on this device’s browser. Copy the backup text and keep it safe (WhatsApp it to yourself). To restore on another phone, paste it below.</p><textarea id="bk" rows="4">${esc(JSON.stringify(db))}</textarea><p><button class="b g" onclick="$('#bk').select();document.execCommand('copy')">Copy backup</button> <button class="b" onclick="restore()">Restore from text</button></p></div>`}};
function addS(){const n=$('#n').value.trim(),c=$('#c').value.trim();if(!n||!c)return say('Enter name and class');db.students.push({id:uid(),name:n,cls:c,phone:$('#p').value,email:$('#e').value,sex:$('#sx2').value,fee:+$('#f').value||0});cls=c;go()}
function delS(id){show(`<div class="rp"><p>Remove this student?</p><p><button class="b d" onclick="delOk('${id}')">Yes, remove</button></p></div>`,1)}
function delOk(id){db.students=db.students.filter(s=>s.id!==id);$('#ov').classList.remove('show');go()}
function setSc(id,i,v){const x=db.scores[id]=db.scores[id]||{};const a=x[subj]=x[subj]||[];a[i]=v===''?'':Math.min(+v,i===1?db.school.ex:i===2?db.school.ca2:db.school.ca);save();const t=tot(id,subj);$('#t'+id).textContent=t;$('#g'+id).textContent=grade(t)}
function pay(id){const s=db.students.find(x=>x.id===id);show(`<div class="rp"><p>Record payment for <b>${esc(s.name)}</b><br>Owes: ${N(Math.max(s.fee-paid(id),0))}</p><label>Amount paid (₦)</label><input id="pa" type="number" inputmode="numeric"><p><button class="b" onclick="payOk('${id}')">Save and show receipt</button></p></div>`,1)}
function payOk(id){const v=+$('#pa').value;if(!(v>0))return say('Enter an amount');db.pays.push({id:uid(),sid:id,amt:v,date:today()});go();rcpt(id)}
function head(){const d=db.school;return `<div class="wm">${d.logo?`<img src="${d.logo}" style="width:60%;opacity:.1">`:`<div style="font-size:46px;font-weight:700;opacity:.07;transform:rotate(-25deg);text-align:center">${esc(d.motto||d.name)}</div>`}</div><div style="text-align:center">${d.logo?`<img src="${d.logo}" style="height:60px">`:''}<h2 style="margin:0">${esc(d.name)}</h2>${d.motto?`<i>${esc(d.motto)}</i><br>`:''}<div>${esc(d.addr)}${d.phone?' · '+esc(d.phone):''}</div></div><hr>`}
function show(h,raw,bar){$('#rp').innerHTML=raw?h:'<div class="rp">'+h+'</div>';$('#bar').innerHTML=bar||'';{const b=$('#pb');if(b){b.textContent='Share as PDF';b.onclick=sharePdf}}$('#ov').classList.add('show')}
function rcpt(id){const s=db.students.find(x=>x.id===id),l=db.pays.filter(p=>p.sid===id),p=l[l.length-1];if(!p)return say('No payment yet');pn=s.name+' receipt';
show(head()+`<h3 style="text-align:center">FEE RECEIPT</h3><p>Receipt No: ${p.id.toUpperCase()}<br>Date: ${p.date}<br>Student: <b>${esc(s.name)}</b> (${esc(s.cls)})<br>${esc(db.school.session)} ${esc(db.school.term)}</p><p>Term fee: ${N(s.fee)}<br>Amount paid now: <b>${N(p.amt)}</b><br>Total paid: ${N(paid(id))}<br>Balance: <b>${N(Math.max(s.fee-paid(id),0))}</b></p>${hmBlock()}${acb()}${foot()}`,0,wa(s,`Receipt from ${db.school.name}: ${s.name} paid ${N(p.amt)} on ${p.date}. Total paid ${N(paid(id))}, balance ${N(Math.max(s.fee-paid(id),0))}. ${bk()} Thank you.`))}
const lvl=c=>{const x=String(c).toLowerCase().replace(/\s/g,'');return /^(jss|js|jnr|junior)/.test(x)?'Junior Secondary School':/^(sss|ss|snr|senior)/.test(x)?'Senior Secondary School':/^(nur|kg|cre)/.test(x)?'Nursery School':/^(pri|pry|basic)/.test(x)?'Primary School':db.school.level||''};
function ord(n){const q=['th','st','nd','rd'],v=n%100;return n+(q[(v-20)%10]||q[v]||q[0])}
function subStats(id,j){const st=db.students.find(x=>x.id===id),l=inCls(st.cls).map(x=>tot(x.id,j)).filter(t=>t!=null),t=tot(id,j);if(t==null||!l.length)return['',''];return[Math.round(l.reduce((a,b)=>a+b,0)/l.length),ord(l.filter(x=>x>t).length+1)]}
function attn(id){const st=db.students.find(x=>x.id===id);let p=0,d=0;for(const dt in db.att){const a=(db.att[dt]||{})[st.cls];if(a&&a[id]){d++;if(a[id]==='P')p++}}return d?p+'/'+d:'-'}
function rate(id,k,i,v){const L=db.school[k].split(',').map(x=>x.trim()).filter(Boolean),x=db.scores[id]=db.scores[id]||{};x._r=x._r||{};(x._r[k]=x._r[k]||{})[L[i]]=+v||0;save();$('#rp').innerHTML='<div class="rp">'+card(id)+'</div>'}
function card(id){const d=db.school,s=db.students.find(x=>x.id===id),n=d.subjects.length,t=sum(id),a=t/n,c=db.cm[id]||{},o=Math.max(s.fee-paid(id),0),mx=d.ca+d.ca2+d.ex,cl=inCls(s.cls),cav=cl.length?cl.reduce((q,x)=>q+avg(x.id),0)/cl.length:0,R={A:'Excellent',B:'Very Good',C:'Credit',D:'Pass',E:'Fair',F:'Fail'};
const dom=(k,ti)=>{const L=d[k].split(',').map(x=>x.trim()).filter(Boolean),r=((db.scores[id]||{})._r||{})[k]||{};return `<table class="dm"><tr><th colspan="6">${ti}</th></tr><tr><th>Item</th>${[5,4,3,2,1].map(i=>`<th>${i}</th>`).join('')}</tr>${L.map(b=>`<tr><td>${esc(b)}</td>${[5,4,3,2,1].map(i=>`<td>${r[b]===i?'✔':''}</td>`).join('')}</tr>`).join('')}</table>`};
return head()+`<div style="text-align:center;font-weight:700;margin-bottom:6px;font-size:14px">${lvl(s.cls)?esc(lvl(s.cls))+'<br>':''}${esc(d.session)} Session ${esc(d.term.replace(' Term',''))} - Term ${esc(d.rt)}</div><table class="in"><tr><td><b>Name:</b> ${esc(s.name)}</td><td><b>Class size:</b> ${cl.length}</td><td><b>Session / Term:</b> ${esc(d.session)} / ${esc(d.term)}</td></tr><tr><td><b>Sex:</b> ${esc(s.sex||'-')}</td><td><b>Student average:</b> ${a.toFixed(0)}</td><td><b>Position:</b> ${pos(id)}</td></tr><tr><td><b>Class:</b> ${esc(s.cls)}</td><td><b>Class average:</b> ${cav.toFixed(0)}</td><td><b>Attendance:</b> ${attn(id)}</td></tr></table><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><div style="flex:3 1 360px"><table class="cg"><tr><th>Subject</th><th>1st CA (${d.ca})</th>${d.ca2?`<th>2nd CA (${d.ca2})</th>`:''}<th>Exam (${d.ex})</th><th>Total (${mx})</th><th>Class Avg</th><th>Pos</th><th>Grade</th><th>Remark</th></tr>${d.subjects.map(j=>{const x=sc(id,j),T=tot(id,j),[ca,po]=subStats(id,j);return `<tr><td>${esc(j)}</td><td>${x[0]??''}</td>${d.ca2?`<td>${x[2]??''}</td>`:''}<td>${x[1]??''}</td><td>${T??''}</td><td>${ca}</td><td>${po}</td><td>${T==null?'':grade(T)}</td><td>${T==null?'':R[grade(T)]||''}</td></tr>`}).join('')}</table></div><div style="flex:1.3 1 190px">${dom('aff','Affective Domain')}<div style="height:6px"></div>${dom('psy','Psychomotor Domain')}</div></div><p>Teacher’s comment: <i>${esc(tcm(id))}</i></p><p>Principal’s comment: <i>${esc(c.p||'')}</i></p><p><b>School fees:</b> ${N(s.fee)} · Paid: ${N(paid(id))} · Balance: <b>${N(o)}</b>${o>0?' (please clear before resumption)':' (fully paid)'}</p>${d.next?`<p>Next term begins: <b>${esc(d.next)}</b></p>`:''}${hmBlock(1)}${o>0?acb():''}<small>Grading: ${esc(d.gb.replace(/:/g,' from ').replace(/,/g,', '))}</small>${foot()}`}
function report(id){const s=db.students.find(x=>x.id===id),c=db.cm[id]||{},t=(db.scores[id]||{})._t,ad=!(prof&&prof.role==='teacher');pn=s.name+' report card';show(card(id),0,`<label>Teacher’s comment (leave blank for auto comment)</label><textarea rows="2" oninput="cm(this.value,'${id}','t')">${esc(t||c.t||'')}</textarea>${ad?`<label>Principal’s comment</label><textarea rows="2" oninput="cm(this.value,'${id}','p')">${esc(c.p||'')}</textarea>`:''}<details style="margin-top:8px"><summary><b>Behaviour and skills ratings (1 to 5)</b></summary>${[['aff','Affective domain'],['psy','Psychomotor domain']].map(([k,ti])=>`<p><b>${ti}</b></p>`+db.school[k].split(',').map(x=>x.trim()).filter(Boolean).map((b,i)=>`<div class="r" style="align-items:center"><span>${esc(b)}</span><select onchange="rate('${id}','${k}',${i},this.value)"><option value=""></option>${[5,4,3,2,1].map(v=>`<option ${((((db.scores[id]||{})._r||{})[k]||{})[b])===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')).join('')}</details><p>${wa(s,`${db.school.name}: ${s.name} (${s.cls}) ${db.school.term} result. Total ${sum(id)}/${db.school.subjects.length*100}, Average ${avg(id).toFixed(1)}%, Position ${pos(id)}. Fee balance ${N(Math.max(s.fee-paid(id),0))}.${s.fee>paid(id)?' '+bk():''}`)}</p>`)}
function cm(v,id,k){if(k==='t'){(db.scores[id]=db.scores[id]||{})._t=v}else{(db.cm[id]=db.cm[id]||{})[k]=v}save();$('#rp').innerHTML='<div class="rp">'+card(id)+'</div>'}
function allRep(){const l=inCls(cls);pn=cls+' report cards';if(l.length)show(l.map(s=>'<div class="rp" style="page-break-after:always">'+card(s.id)+'</div>').join(''),1)}
function rank(){const l=inCls(cls).map(s=>[s.name,sum(s.id),avg(s.id),pos(s.id)]).sort((a,b)=>b[1]-a[1]);return `<div class="c t"><b>Class ranking</b><table><tr><th>Pos</th><th>Name</th><th>Total</th><th>Avg</th></tr>${l.map(x=>`<tr><td>${x[3].split(' ')[0]}</td><td>${esc(x[0])}</td><td>${x[1]}</td><td>${x[2].toFixed(1)}%</td></tr>`).join('')}</table></div>`}
function remind(id){const s=db.students.find(x=>x.id===id),o=s.fee-paid(id);pn=s.name+' fee reminder';show(`<div class="rp">${head()}<p>Fee reminder for <b>${esc(s.name)}</b>: outstanding ${N(o)}.</p>${acb()}${foot()}</div>`,1,wa(s,`Dear Parent, a gentle reminder from ${db.school.name}: ${s.name}’s outstanding school fee for ${db.school.term} is ${N(o)}. ${bk()} Thank you.`))}
function bulk(){const c=$('#bc').value.trim();if(!c)return say('Enter class');let k=0;$('#bl').value.split('\n').forEach(l=>{const [n,p,e]=l.split(',').map(x=>x.trim());if(n){db.students.push({id:uid(),name:n,cls:c,phone:p||'',email:e||'',fee:db.school.fee});k++}});cls=c;go();say(k+' students added')}
function mark(id,v){const a=db.att[window.ad]=db.att[window.ad]||{};(a[cls]=a[cls]||{})[id]=v;go()}
function img(el,k){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(k==='logo'?300:260,im.width),h=im.height*w/im.width,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);db.school[k]=c.toDataURL('image/png');saveSet();say('Uploaded ✓')};im.src=r.result};r.readAsDataURL(f)}
let pn='Document',pf=null;
async function sharePdf(){const b=$('#pb');b.textContent='Preparing PDF…';$('#ov').scrollTop=0;try{const blob=await html2pdf().set({margin:8,filename:pn+'.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,scrollY:0},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy']}}).from($('#rp')).outputPdf('blob');pf=new File([blob],pn+'.pdf',{type:'application/pdf'});b.textContent='Tap to share PDF';b.onclick=doShare}catch(e){b.textContent='Share as PDF';say('Could not make PDF: '+e.message)}}
function doShare(){const b=$('#pb');b.textContent='Share as PDF';b.onclick=sharePdf;if(navigator.canShare&&navigator.canShare({files:[pf]}))navigator.share({files:[pf],title:pn}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(pf);a.download=pf.name;a.click();say('PDF downloaded')}}
function saveSet(){const s=db.school;s.name=$('#sn').value||'My School';s.addr=$('#sa').value;s.session=$('#ss').value;s.term=$('#st').value;s.fee=+$('#sf').value||0;s.phone=$('#sp').value;s.motto=$('#smo').value;s.hm=$('#shm').value;s.bank=$('#sbk').value;s.acn=$('#san').value;s.acc=$('#sac').value;s.next=$('#sx').value;s.ca=+$('#sca').value||40;s.ca2=+$('#sca2').value||0;s.rt=$('#srt').value||'Final Report';s.level=$('#slv').value;s.aff=$('#saf').value||DS.aff;s.psy=$('#sps').value||DS.psy;s.ex=+$('#sex').value||60;s.gb=$('#sg').value||DS.gb;s.rem=$('#sr').value||DS.rem;s.subjects=$('#sj').value.split(',').map(x=>x.trim()).filter(Boolean);go()}
function restore(){try{const d=JSON.parse($('#bk').value);if(!d.school)throw 0;db=d;db.school={...DS,...db.school};db.cm=db.cm||{};go();say('Restored')}catch(e){say('Invalid backup text')}}
const SB_URL='https://cuyvdzflxqjwgsbgdfzv.supabase.co',SB_KEY='sb_publishable_nP7JGmQ5giC4amcg61-qQw__0J3qCXM';
let sb,me,prof,last={};
const ind=m=>{const e=$('#ind');if(e)e.textContent=m};
function shards(){const o={core:{school:db.school,students:db.students,pays:db.pays,cm:db.cm}};
for(const st of db.students)for(const [sub,v] of Object.entries(db.scores[st.id]||{})){const k='scores:'+st.cls+':'+sub;(o[k]=o[k]||{})[st.id]=v}
for(const [d,cs] of Object.entries(db.att))for(const [c,v] of Object.entries(cs))o['att:'+c+':'+d]=v;return o}
function unshard(rows){db={school:{...DS},students:[],scores:{},pays:[],att:{},cm:{}};for(const r of rows){const p=r.key.split(':'),v=r.val,x=p.slice(2).join(':');
if(r.key==='core'){db.school={...DS,...v.school};db.students=v.students||[];db.pays=v.pays||[];db.cm=v.cm||{}}
else if(p[0]==='scores'){for(const id in v)(db.scores[id]=db.scores[id]||{})[x]=v[id]}
else if(p[0]==='att'){(db.att[x]=db.att[x]||{})[p[1]]=v}}}
async function push(){if(!me)return;const s=shards(),rows=[];for(const k in s){const j=JSON.stringify(s[k]);if(last[k]!==j)rows.push({key:k,val:s[k],updated_by:me.id,j})}
if(!rows.length)return;ind('Saving…');const {error}=await sb.from('kv').upsert(rows.map(({j,...r})=>r));if(error)return ind('Not saved: '+error.message);rows.forEach(r=>last[r.key]=r.j);ind('Saved ✓')}
async function loadAll(){const {data,error}=await sb.from('kv').select('key,val');if(error)return say(error.message);unshard(data);last=shards()}
function loginUI(msg){$('#nav').innerHTML='';$('#ttl').textContent='School Manager';$('#sub').textContent='Results · Fees · Attendance';$('#m').innerHTML=`<div class="lg">${['📚','✏️','🎓','📖','🍎','🧮','🔬','📝'].map((e,i)=>`<span class="fl" style="left:${i*13+2}%;animation-delay:${i*-1.1}s;animation-duration:${8+i%3*2}s">${e}</span>`).join('')}<svg class="bk" viewBox="0 0 120 80"><path d="M60 14C44 6 22 8 8 14v52c14-6 36-8 52 0z" fill="#fff"/><path d="M60 14c16-8 38-6 52 0v52c-14-6-36-8-52 0z" fill="#e6f4ec"/><path class="pg" d="M60 14c16-8 38-6 52 0v52c-14-6-36-8-52 0z" fill="#fff" stroke="#0f6b4a" stroke-width="1"/><path d="M60 14v52" stroke="#0f6b4a" stroke-width="2"/></svg><h2 style="text-align:center;margin:4px 0 14px;position:relative;z-index:1">Welcome</h2><div class="c"><h3 style="margin-top:0">Sign in</h3>${msg?`<p class="d">${esc(msg)}</p>`:''}<label>Full name (new accounts only)</label><input id="an"><label>Email</label><input id="ae" type="email"><label>Password (min 6 characters)</label><input id="ap" type="password"><p><button class="b" onclick="auth(0)">Log in</button> <button class="b g" onclick="auth(1)">Create account</button></p></div><div class="pw"><span class="dot"></span>Powered by <b>Softsub Digital</b> · 09126459668</div></div>`}
async function auth(up){const e=$('#ae').value.trim(),p=$('#ap').value;const r=up?await sb.auth.signUp({email:e,password:p,options:{data:{name:$('#an').value}}}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return loginUI(r.error.message);if(up&&!r.data.session)return loginUI('Account created. Please log in.');boot()}
function waitUI(){$('#nav').innerHTML='';$('#m').innerHTML='<div class="c"><h3>Waiting for approval</h3><p>Ask the school admin to approve your account, then tap Refresh.</p><button class="b" onclick="boot()">Refresh</button> <button class="b g" onclick="out()">Log out</button></div>'}

async function loadUsers(){const {data}=await sb.from('profiles').select('*').order('created_at');$('#us').innerHTML='<b>Approve staff</b><p class="mu">New accounts start as pending. Set the role and, for teachers, the classes they teach (comma separated, written exactly as in Students).</p><table><tr><th>Name</th><th>Role</th><th>Classes</th><th></th></tr>'+data.map(u=>`<tr><td>${esc(u.name||u.email)}</td><td><select id="r${u.id}">${opts(['pending','teacher','admin'],u.role)}</select></td><td><input id="c${u.id}" value="${esc(u.classes||'')}"></td><td><button class="b g" onclick="setU('${u.id}')">Save</button></td></tr>`).join('')+'</table>'}
async function setU(id){if(id===me.id&&$('#r'+id).value!=='admin')return say('You cannot remove your own admin role.');const {data,error}=await sb.from('profiles').update({role:$('#r'+id).value,classes:$('#c'+id).value}).eq('id',id).select();if(error)return say(error.message);if(!data||!data.length)return say('Not saved: only an admin can change roles. Log in as the admin account.');say('Saved ✓ '+(data[0].name||data[0].email)+' is now '+data[0].role);loadUsers()}
async function boot(){if(SB_URL.startsWith('PASTE')){$('#m').innerHTML='<div class="c">Setup needed: put your Supabase URL and key at the top of the script section.</div>';return}
sb=sb||supabase.createClient(SB_URL,SB_KEY);const {data:{session}}=await sb.auth.getSession();if(!session){me=null;return loginUI()}me=session.user;
const {data:p}=await sb.from('profiles').select('*').eq('id',me.id).single();prof=p;if(!p||p.role==='pending')return waitUI();
await loadAll();tabs.splice(0,tabs.length,...(p.role==='admin'?['Students','Results','Fees','Attendance','Users','Settings']:['Results','Attendance']));tab=tabs[0];cls='';go()}
boot();
